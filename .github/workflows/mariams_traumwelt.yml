name: OpenFactory Cloud Engine - Mariams Traumwelt Extreme

on:
  repository_dispatch:
    types: [start_iso_build]

jobs:
  build_iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Build ISO inside Extreme Customizer Container
        run: |
          docker run --privileged -v ${{ github.workspace }}:/workspace archlinux:latest /bin/bash -c "
            set -e
            echo 'Server = https://kernel.org\$repo/os/\$arch' > /etc/pacman.d/mirrorlist
            pacman -Syy
            pacman -Syu --noconfirm archiso squashfs-tools git
            cp -r /usr/share/archiso/configs/releng /tmp/archiso-profile
            echo -e 'plasma-desktop\nkonsole\nnetworkmanager\nbluez\nbluez-utils\npulse-native-provider\nsof-firmware\nlinux-firmware\nxorg-server\nvlc\nnano\nfirefox\nzenity' >> /tmp/archiso-profile/packages.x86_64
            mkdir -p /tmp/archiso-profile/airootfs/usr/share/backgrounds/
            mkdir -p /tmp/archiso-profile/airootfs/etc/skel/.config/
            mkdir -p /tmp/archiso-profile/airootfs/usr/local/bin/
            
            # Fehlerfreie Bildprüfung und Einbindung
            if [ -f /workspace/1794148330326[1].png ]; then
              cp /workspace/1794148330326[1].png /tmp/archiso-profile/airootfs/usr/share/backgrounds/traumwelt.png
            elif [ -f /workspace/1794148330326.png ]; then
              cp /workspace/1794148330326.png /tmp/archiso-profile/airootfs/usr/share/backgrounds/traumwelt.png
            fi
            
            # Die 24-Stunden-Geschenk-Funktion
            echo -e '#!/bin/bash\nif [ ! -f ~/.last_gift ] || [ \$((\$(date +%s) - \$(cat ~/.last_gift))) -gt 86400 ]; then\n  zenity --info --title=\"Mamis Ueberraschung\" --text=\"Guten Morgen Mama! Hier ist deine heutige Ueberraschung: Du bist die beste Mama der Welt! ❤️\" --width=400\n  date +%s > ~/.last_gift\nelse\n  zenity --info --title=\"Warten...\" --text=\"Deine nächste Ueberraschung lädt noch... Bitte warte die 24 Stunden ab! ✨\" --width=400\nfi' > /tmp/archiso-profile/airootfs/usr/local/bin/open_gift.sh
            chmod +x /tmp/archiso-profile/airootfs/usr/local/bin/open_gift.sh
            
            echo -e '[Shell][Version]\n/Themes/KasiaTransparent=true\n/Panels/LeftMenu=true\n/Panels/RightWidgets=true' > /tmp/archiso-profile/airootfs/etc/skel/.config/plasmarc
            mkdir -p /workspace/output
            mkarchiso -v -w /tmp/archiso-workspace -o /workspace/output /tmp/archiso-profile
          "

      - name: Upload Finished ISO
        uses: actions/upload-artifact@v4
        with:
          name: Mariams-Traumwelt-ISO
          path: output/*.iso
          retention-days: 1
